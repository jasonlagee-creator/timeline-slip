name: TS-001 read-only evidence snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  issues: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture public issue comments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/collect_ts001.py
      - name: Verify collected snapshot before archival
        run: python scripts/verify_snapshot.py evidence/snapshot.json evidence/snapshot.sha256
      - name: Archive snapshot as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ts001-evidence-${{ github.run_id }}
          path: evidence/
          retention-days: 90
